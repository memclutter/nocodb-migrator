# Local hooks: they shell out to the Go toolchain installed on the machine, so
# `go`, `gofmt`, and `golangci-lint` must be on PATH. Install with
# `pre-commit install`. See CONTRIBUTING.md.
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test (unit)
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
